{
  "name": "Unsigned native packages",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "platform": {
          "description": "Which platform(s) to build",
          "type": "choice",
          "default": "both",
          "options": [
            "both",
            "macos",
            "windows"
          ]
        }
      }
    },
    "push": {
      "tags": ["v*"],
      "branches": ["main"],
      "paths": [
        "packaging/media-stack/manifest.toml",
        "packaging/media-stack/tools.in",
        "packaging/media-stack/tools.lock",
        "scripts/media_stack/**",
        "scripts/build_media_stack.py",
        "scripts/verify_media_stack.py"
      ]
    }
  },
  "concurrency": {
    "group": "matteloop-native-release",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "plan": {
      "runs-on": "ubuntu-22.04",
      "outputs": {
        "targets": "${{ steps.select.outputs.targets }}"
      },
      "steps": [
        {
          "id": "select",
          "run": "case \"${{ inputs.platform }}\" in\n  windows) targets='[{\"target\":\"windows-2022-x64\",\"os\":\"windows-2022\"}]' ;;\n  macos) targets='[{\"target\":\"macos-15-arm64\",\"os\":\"macos-15\"}]' ;;\n  *) targets='[{\"target\":\"windows-2022-x64\",\"os\":\"windows-2022\"},{\"target\":\"macos-15-arm64\",\"os\":\"macos-15\"}]' ;;\nesac\necho \"targets=$targets\" >> \"$GITHUB_OUTPUT\""
        },
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "name": "Assert tag matches package version",
          "if": "startsWith(github.ref, 'refs/tags/v')",
          "run": "version=\"${GITHUB_REF_NAME#v}\"\ngrep -Fqx \"__version__ = \\\"$version\\\"\" src/matteloop/__init__.py"
        }
      ]
    },
    "native-package": {
      "name": "${{ matrix.target }}",
      "needs": "plan",
      "permissions": {
        "contents": "read"
      },
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": "${{ fromJson(needs.plan.outputs.targets) }}"
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "name": "Install uv and Python",
          "id": "setup-uv",
          "uses": "astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d",
          "with": {
            "enable-cache": false,
            "python-version": "3.13",
            "version": "0.11.32"
          }
        },
        {
          "name": "Install macOS media build tools",
          "if": "runner.os == 'macOS'",
          "run": "if ! command -v cmake >/dev/null || ! command -v nasm >/dev/null || ! command -v pkg-config >/dev/null; then\n  brew install cmake nasm pkg-config\nfi"
        },
        {
          "name": "Configure MSVC amd64",
          "if": "runner.os == 'Windows'",
          "uses": "ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756",
          "with": {
            "arch": "amd64"
          }
        },
        {
          "name": "Install MSYS2 media build tools",
          "if": "runner.os == 'Windows'",
          "uses": "msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884",
          "with": {
            "msystem": "MSYS",
            "path-type": "inherit",
            "install": "base-devel make diffutils nasm pkgconf"
          }
        },
        {
          "name": "Restore media build stack cache",
          "id": "media-stack-cache",
          "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": ".matteloop-build-cache/media-stack",
            "key": "media-stack-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('packaging/media-stack/manifest.toml', 'packaging/media-stack/tools.in', 'packaging/media-stack/tools.lock', 'scripts/media_stack/**/*.py', 'scripts/build_media_stack.py', 'scripts/verify_media_stack.py') }}"
          }
        },
        {
          "name": "Install frozen dependencies",
          "run": "uv sync --frozen --all-groups"
        },
        {
          "name": "Restore Nuitka compile cache",
          "uses": "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/.cache/Nuitka\n~/Library/Caches/Nuitka\n~\\AppData\\Local\\Nuitka\\Nuitka\\Cache",
            "key": "nuitka-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}",
            "restore-keys": "nuitka-${{ runner.os }}-${{ matrix.target }}-"
          }
        },
        {
          "name": "Build native standalone bundle",
          "run": "uv run --frozen --no-sync python scripts/build.py"
        },
        {
          "name": "Stage 0: verify macOS swap and relaunch",
          "if": "runner.os == 'macOS'",
          "run": "set -euo pipefail\nmv dist/MatteLoop.app dist/MatteLoop-stage0-original.app\ncp -R dist/MatteLoop-stage0-original.app dist/MatteLoop-stage0-copy.app\nmv dist/MatteLoop-stage0-copy.app dist/MatteLoop.app\nversion=$(sed -n 's/^__version__ = \\\"\\(.*\\)\\\"$/\\1/p' src/matteloop/__init__.py)\ntest -n \"$version\"\ntest \"$(dist/MatteLoop.app/Contents/MacOS/matteloop --version)\" = \"MatteLoop $version\"\nrm -rf dist/MatteLoop.app\nmv dist/MatteLoop-stage0-original.app dist/MatteLoop.app"
        },
        {
          "name": "Set DOTNET_ROOT (macOS)",
          "if": "runner.os == 'macOS'",
          "run": "dotnet_path=$(realpath \"$(command -v dotnet)\")\ndotnet_bin=$(dirname \"$dotnet_path\")\nif [ -d \"$dotnet_bin/../libexec\" ]; then\n  dotnet_root=\"$(cd \"$dotnet_bin/../libexec\" && pwd)\"\nelse\n  dotnet_root=\"$dotnet_bin\"\nfi\necho \"DOTNET_ROOT=$dotnet_root\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Set DOTNET_ROOT (Windows)",
          "if": "runner.os == 'Windows'",
          "shell": "pwsh",
          "run": "$dotnet = (Get-Command dotnet).Source\n\"DOTNET_ROOT=$(Split-Path $dotnet)\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
        },
        {
          "name": "Install pinned Velopack CLI",
          "run": "dotnet tool install vpk --version 1.2.0 --tool-path .vpk"
        },
        {
          "name": "Read macOS package version",
          "if": "runner.os == 'macOS'",
          "run": "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/MatteLoop.app/Contents/Info.plist)\necho \"VERSION=$version\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Read Windows package version",
          "if": "runner.os == 'Windows'",
          "shell": "pwsh",
          "run": "$match = Select-String -Path src\\matteloop\\__init__.py -Pattern '^__version__ = \"(.*)\"$'\nif (-not $match) { throw 'src\\matteloop\\__init__.py has no __version__.' }\n$version = $match.Matches[0].Groups[1].Value\n\"VERSION=$version\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
        },
        {
          "name": "Pack macOS Velopack release",
          "if": "runner.os == 'macOS'",
          "run": "mkdir -p dist/velopack\n.vpk/vpk \"[osx]\" pack --packId io.github.smb-org.matteloop --packVersion \"$VERSION\" --packDir dist/MatteLoop.app --mainExe matteloop --channel osx-arm64 --runtime osx-arm64 --packTitle MatteLoop --noInst --delta None --outputDir dist/velopack"
        },
        {
          "name": "Pack Windows Velopack release",
          "if": "runner.os == 'Windows'",
          "shell": "pwsh",
          "run": "New-Item -ItemType Directory -Force dist\\velopack | Out-Null\n.vpk\\vpk.exe \"[win]\" pack --packId io.github.smb-org.matteloop --packVersion $env:VERSION --packDir dist\\MatteLoop.dist --mainExe matteloop.exe --channel win-x64 --runtime win-x64 --packTitle MatteLoop --icon assets\\branding\\matteloop\\derived\\matteloop.ico --shortcuts StartMenuRoot --delta None --outputDir dist\\velopack"
        },
        {
          "name": "Verify packed macOS launcher",
          "if": "runner.os == 'macOS'",
          "run": "set -euo pipefail\npacked=$(find dist/velopack -maxdepth 1 -type f -name '*.zip' -print -quit)\ntest -n \"$packed\"\nextracted=$(mktemp -d)\nunzip -q \"$packed\" -d \"$extracted\"\napp=$(find \"$extracted\" -maxdepth 1 -type d -name '*.app' -print -quit)\ntest -n \"$app\"\nlauncher=\"$app/Contents/MacOS/matteloop\"\ntest -x \"$launcher\""
        },
        {
          "name": "Verify packed macOS launchability",
          "if": "runner.os == 'macOS'",
          "run": "set -euo pipefail\npacked=$(find dist/velopack -maxdepth 1 -type f -name '*.zip' -print -quit)\ntest -n \"$packed\"\nextracted=$(mktemp -d)\nunzip -q \"$packed\" -d \"$extracted\"\napp=$(find \"$extracted\" -maxdepth 1 -type d -name '*.app' -print -quit)\ntest -n \"$app\"\nversion=\"$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \"$app/Contents/Info.plist\")\"\ntest \"$(\"$app/Contents/MacOS/matteloop\" --version)\" = \"MatteLoop $version\""
        },
        {
          "name": "Record packed macOS code signature",
          "if": "runner.os == 'macOS'",
          "run": "set -euo pipefail\npacked=$(find dist/velopack -maxdepth 1 -type f -name '*.zip' -print -quit)\ntest -n \"$packed\"\nextracted=$(mktemp -d)\nunzip -q \"$packed\" -d \"$extracted\"\napp=$(find \"$extracted\" -maxdepth 1 -type d -name '*.app' -print -quit)\ntest -n \"$app\"\nset +e\ncodesign --verify --deep \"$app\"\nstatus=$?\nset -e\necho \"codesign --verify --deep exit status: $status (recorded; not a gate)\""
        },
        {
          "name": "Report compile cache statistics",
          "if": "always()",
          "shell": "bash",
          "run": "set +e\nif [ \"$RUNNER_OS\" = \"Windows\" ]; then\n  nuitka_cache=\"$HOME/AppData/Local/Nuitka/Nuitka/Cache\"\nelif [ \"$RUNNER_OS\" = \"macOS\" ]; then\n  nuitka_cache=\"$HOME/Library/Caches/Nuitka\"\nelse\n  nuitka_cache=\"$HOME/.cache/Nuitka\"\nfi\necho \"Nuitka cache: $nuitka_cache\"\ndu -sh \"$nuitka_cache\" 2>/dev/null || true\nif [ \"$RUNNER_OS\" = \"Windows\" ]; then\n  ccache_bin=\"$(find \"$nuitka_cache\" -type f -iname 'ccache.exe' -print -quit 2>/dev/null || true)\"\n  if [ -n \"$ccache_bin\" ]; then\n    \"$ccache_bin\" -s || true\n  else\n    echo \"ccache not found\"\n  fi\nelif command -v ccache >/dev/null; then\n  ccache -s || true\nelse\n  echo \"ccache not found\"\nfi\ntrue"
        },
        {
          "name": "Save media build stack cache",
          "if": "always() && steps.media-stack-cache.outputs.cache-hit != 'true'",
          "uses": "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": ".matteloop-build-cache/media-stack",
            "key": "media-stack-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('packaging/media-stack/manifest.toml', 'packaging/media-stack/tools.in', 'packaging/media-stack/tools.lock', 'scripts/media_stack/**/*.py', 'scripts/build_media_stack.py', 'scripts/verify_media_stack.py') }}"
          }
        },
        {
          "name": "Save Nuitka compile cache",
          "if": "always()",
          "uses": "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9",
          "with": {
            "path": "~/.cache/Nuitka\n~/Library/Caches/Nuitka\n~\\AppData\\Local\\Nuitka\\Nuitka\\Cache",
            "key": "nuitka-${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}"
          }
        },
        {
          "name": "Create macOS application archive",
          "if": "runner.os == 'macOS'",
          "run": "ditto -c -k --norsrc --keepParent dist/MatteLoop.app \"dist/MatteLoop-${{ matrix.target }}.zip\""
        },
        {
          "name": "Upload retained media-stack staging on failure",
          "if": "failure()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "media-stack-staging-${{ matrix.target }}",
            "path": "build-failure-diagnostics",
            "if-no-files-found": "warn"
          }
        },
        {
          "name": "Upload unsigned bundle",
          "id": "upload",
          "if": "runner.os == 'Windows'",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "MatteLoop-unsigned-${{ matrix.target }}",
            "path": "dist/MatteLoop.dist\ndist/MatteLoop-*-sources-*",
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        },
        {
          "name": "Upload macOS application archive",
          "if": "runner.os == 'macOS'",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "MatteLoop-unsigned-${{ matrix.target }}",
            "path": "dist/MatteLoop-${{ matrix.target }}.zip\ndist/MatteLoop-*-sources-*",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Upload Velopack output",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "MatteLoop-velopack-${{ matrix.target }}",
            "path": "dist/velopack",
            "if-no-files-found": "error",
            "include-hidden-files": true
          }
        }
      ]
    },
    "publish": {
      "needs": "native-package",
      "if": "startsWith(github.ref, 'refs/tags/v')",
      "runs-on": "ubuntu-22.04",
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "Download unsigned bundles",
          "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
          "with": {
            "path": "bundles",
            "pattern": "MatteLoop-*"
          }
        },
        {
          "name": "Separate the application from its LGPL source archives",
          "run": "mkdir -p assets\nfor bundle in bundles/MatteLoop-unsigned-*; do\n  target=\"${bundle##*/MatteLoop-unsigned-}\"\n  # The source archives beside the bundle are the LGPL corresponding\n  # sources; they ship as their own assets so the application download is\n  # not 90 MB heavier for every user. Whatever remains is the application.\n  find \"$bundle\" -maxdepth 1 -name \"MatteLoop-*-sources-*\" -exec mv {} assets/ \\;\n  if [ \"$target\" = \"macos-15-arm64\" ]; then\n    mv \"$bundle/MatteLoop-${target}.zip\" \"assets/MatteLoop-${GITHUB_REF_NAME}-${target}.zip\"\n  else\n    (cd \"$bundle\" && zip -qry \"../../assets/MatteLoop-${GITHUB_REF_NAME}-${target}.zip\" .)\n  fi\ndone\nls -lh assets"
        },
        {
          "name": "Rename Velopack assets and assert release completeness",
          "run": "set -euo pipefail\nmkdir -p assets\nrm -f \"assets/MatteLoop-${GITHUB_REF_NAME}-macos-15-arm64.zip\"\nrm -f \"assets/MatteLoop-${GITHUB_REF_NAME}-windows-2022-x64.zip\"\nfor package in bundles/MatteLoop-velopack-*; do\n  test -d \"$package\"\n  target=\"${package##*/MatteLoop-velopack-}\"\n  if [ \"$target\" = \"macos-15-arm64\" ]; then\n    feed=$(find \"$package\" -maxdepth 1 -type f -name 'releases.osx-arm64.json' -print -quit)\n    full=$(find \"$package\" -maxdepth 1 -type f -name '*-osx-arm64-full.nupkg' -print -quit)\n    portable=$(find \"$package\" -maxdepth 1 -type f -name '*.zip' -print -quit)\n    test -n \"$feed\" -a -n \"$full\" -a -n \"$portable\"\n    mv \"$feed\" assets/releases.osx-arm64.json\n    mv \"$full\" assets/\n    mv \"$portable\" \"assets/MatteLoop-${GITHUB_REF_NAME}-macos-arm64.zip\"\n  elif [ \"$target\" = \"windows-2022-x64\" ]; then\n    feed=$(find \"$package\" -maxdepth 1 -type f -name 'releases.win-x64.json' -print -quit)\n    full=$(find \"$package\" -maxdepth 1 -type f -name '*-win-x64-full.nupkg' -print -quit)\n    installer=$(find \"$package\" -maxdepth 1 -type f -name '*-Setup.exe' -print -quit)\n    portable=$(find \"$package\" -maxdepth 1 -type f -name '*.zip' -print -quit)\n    test -n \"$feed\" -a -n \"$full\" -a -n \"$installer\" -a -n \"$portable\"\n    mv \"$feed\" assets/releases.win-x64.json\n    mv \"$full\" assets/\n    mv \"$installer\" \"assets/MatteLoop-${GITHUB_REF_NAME}-windows-x64-Setup.exe\"\n    archive_path=\"$PWD/assets/MatteLoop-${GITHUB_REF_NAME}-windows-x64.zip\"\n    root=\"MatteLoop-${GITHUB_REF_NAME}-windows-x64\"\n    staging=$(mktemp -d)\n    mkdir \"$staging/$root\"\n    unzip -q \"$portable\" -d \"$staging/$root\"\n    (cd \"$staging\" && zip -qry \"$archive_path\" \"$root\")\n    rm -rf \"$staging\"\n  else\n    echo \"unexpected Velopack artifact target: $target\" >&2\n    exit 1\n  fi\ndone\ntest -f assets/releases.osx-arm64.json\ntest -f assets/releases.win-x64.json\ntest \"$(find assets -maxdepth 1 -type f -name '*-osx-arm64-full.nupkg' | wc -l | tr -d ' ')\" = 1\ntest \"$(find assets -maxdepth 1 -type f -name '*-win-x64-full.nupkg' | wc -l | tr -d ' ')\" = 1\nls -lh assets"
        },
        {
          "name": "Validate macOS archive launcher permissions",
          "run": "set -euo pipefail\narchive=\"assets/MatteLoop-${GITHUB_REF_NAME}-macos-arm64.zip\"\ntest -f \"$archive\"\nextracted=$(mktemp -d)\nunzip -q \"$archive\" -d \"$extracted\"\npython3 -c 'import pathlib, plistlib, sys; app = pathlib.Path(sys.argv[1]); executable = plistlib.loads((app / \"Contents\" / \"Info.plist\").read_bytes())[\"CFBundleExecutable\"]; launcher = app / \"Contents\" / \"MacOS\" / executable; assert launcher.is_file() and launcher.stat().st_mode & 0o111, f\"{launcher} is not executable\"' \"$extracted/MatteLoop.app\""
        },
        {
          "name": "Create the draft release",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh release create \"$GITHUB_REF_NAME\" assets/* \\\n  --repo \"$GITHUB_REPOSITORY\" \\\n  --draft \\\n  --title \"MatteLoop $GITHUB_REF_NAME\" \\\n  --notes 'Unsigned builds. Windows warns via SmartScreen and macOS needs a right-click Open on first launch.\n\nThe MatteLoop-*-sources-* archives are the complete corresponding sources for the LGPL libraries (FFmpeg, libwebp, Qt) inside the application, published here as required by their licences. They are not needed to run MatteLoop.'"
        }
      ]
    }
  }
}
